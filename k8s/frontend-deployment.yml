apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: assessify
  labels:
    app: assessify-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assessify-frontend
  template:
    metadata:
      labels:
        app: assessify-frontend
    spec:
      containers:
        - name: frontend
          image: assessify-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.assessify.example.com/api"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.assessify.example.com"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: assessify
spec:
  selector:
    app: assessify-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
