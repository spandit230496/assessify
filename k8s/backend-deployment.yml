apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: assessify
  labels:
    app: assessify-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: assessify-backend
  template:
    metadata:
      labels:
        app: assessify-backend
    spec:
      containers:
        - name: backend
          image: assessify-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: assessify-config
            - secretRef:
                name: assessify-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: assessify
spec:
  selector:
    app: assessify-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
