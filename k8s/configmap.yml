apiVersion: v1
kind: ConfigMap
metadata:
  name: assessify-config
  namespace: assessify
data:
  NODE_ENV: "production"
  PORT: "4000"
  FRONTEND_URL: "https://assessify.example.com"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  S3_REGION: "us-east-1"
  S3_BUCKET: "assessify"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
